ci:
  autofix_prs: false
  autoupdate_schedule: quarterly

repos:
- repo: https://github.com/praw-dev/CodeSorter
  rev: 03a8cecfa6ae82183f9e152d1bbb16ea6a6c1d11  # frozen: v0.2.8
  hooks:
    - id: codesorter
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2  # v0.16.1
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/MarcoGorelli/auto-walrus
  rev: d376c6a49feac78bc2115bf3df7e862629cce612  # frozen: 0.4.1
  hooks:
    - id: auto-walrus
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: f4d7745e17a28aad7eed2f4874ca8d1568c11c4c  # v22.1.8
  hooks:
    - id: clang-format
      exclude: ^(ports/doom/|tests/golden/|user/static/)
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
  hooks:
    - id: check-added-large-files
    - id: check-case-conflict
    - id: check-executables-have-shebangs
    - id: check-merge-conflict
    - id: check-shebang-scripts-are-executable
    - id: check-toml
    - id: check-vcs-permalinks
    - id: check-yaml
    - id: detect-private-key
    - id: end-of-file-fixer
    - id: mixed-line-ending
      args: [--fix=no]
    - id: name-tests-test
      args: [--pytest-test-first]
      files: ^tests/unit/.*\.py$
    - id: no-commit-to-branch
    - id: trailing-whitespace
